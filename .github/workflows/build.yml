name: Build StuckFreeze
on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -B build

      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: StuckFreeze-${{ matrix.os }}
          path: |
            build/StuckFreeze_artefacts/Release/VST3
            build/StuckFreeze_artefacts/Release/Standalone
